name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'haqumei/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'haqumei/**'
      - '.github/workflows/**'
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test on ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true
          cache-bin: false

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmPath = (Get-Command clang).Source | Split-Path -Parent
          echo "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV

      - name: Set up Clang Runtime Path (macOS)
        if: runner.os == 'macOS'
        run: |
          CLANG_RT_PATH=$(find $(xcode-select -p) -name "libclang_rt.osx.a" | head -n 1)
          if [ -n "$CLANG_RT_PATH" ]; then
            CLANG_RT_DIR=$(dirname "$CLANG_RT_PATH")
            echo "LIBRARY_PATH=$CLANG_RT_DIR" >> $GITHUB_ENV
            echo "Found clang_rt.osx at: $CLANG_RT_DIR"
          else
            echo "Warning: libclang_rt.osx.a not found"
          fi

      - name: Build
        run: cargo build --verbose --workspace --exclude haqumei-python --no-default-features --features "embed-dictionary download-dictionary"

      - name: Run tests on ${{ matrix.os }}
        run: cargo test --verbose -p haqumei --no-default-features --features "embed-dictionary download-dictionary"
