name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'haqumei/**'
      - 'haqumei-jpreprocess*/**'
      - 'haqumei-jlabel/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'haqumei/**'
      - 'haqumei-jpreprocess*/**'
      - 'haqumei-jlabel/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  schedule:
    - cron: '17 3 1,15 * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test on ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true
          cache-bin: false

      # build.rs verifies and embeds the downloaded archive unchanged, so only
      # that file is cached. The runtime extraction cache stays out.
      # A stale entry costs nothing: build.rs checks the file against
      # COMPRESSED_DICTIONARY_HASH and re-downloads on mismatch, which is also
      # why restore-keys may hand back an older dictionary.
      - name: Cache the downloaded dictionary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/haqumei/dictionary.tar.zst
            ~/Library/Caches/haqumei/dictionary.tar.zst
            ~/AppData/Local/haqumei/dictionary.tar.zst
          key: haqumei-dictionary-${{ runner.os }}-${{ hashFiles('haqumei/build.rs') }}
          restore-keys: |
            haqumei-dictionary-${{ runner.os }}-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy for every workspace target
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --features "haqumei-jpreprocess/binary haqumei-jpreprocess-core/vibrato haqumei-jpreprocess-dictionary/binary" -- -D warnings

      - name: Build
        run: cargo build --verbose --workspace --exclude haqumei-python --exclude haqumei-bench --exclude haqumei-eval --exclude haqumei-dict-tool --no-default-features --features haqumei/embed-dictionary --features haqumei/download-dictionary

      - name: Run tests on ${{ matrix.os }}
        run: cargo test --verbose --workspace --exclude haqumei-python --exclude haqumei-bench --exclude haqumei-eval --exclude haqumei-dict-tool --features "haqumei/embed-dictionary haqumei/download-dictionary"

      - name: Build and test the source dictionary
        if: runner.os == 'Linux'
        run: cargo test -p haqumei --lib --no-default-features --features "embed-dictionary build-dictionary"
