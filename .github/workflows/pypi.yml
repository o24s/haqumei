name: Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'haqumei-python/**'
      - 'haqumei/**'
      - '.github/workflows/pypi.yml'

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","target":"x86_64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","target":"x86_64"},{"os":"ubuntu-24.04-arm","target":"aarch64"},{"os":"windows-latest","target":"x64"},{"os":"macos-latest","target":"aarch64"}]}' >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    needs: setup-matrix
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Copy README
        run: cp README.md haqumei-python/README.md

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmPath = (Get-Command clang).Source | Split-Path -Parent
          echo "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out ../dist
          sccache: 'false'
          manylinux: 2_28
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum update -y && yum install -y perl-core perl-IPC-Cmd perl-Time-Piece clang
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y perl make
            fi
          working-directory: haqumei-python
        env:
          CC_x86_64_unknown_linux_gnu: gcc
          CXX_x86_64_unknown_linux_gnu: g++
          TARGET_CC_x86_64_unknown_linux_gnu: gcc
          TARGET_CXX_x86_64_unknown_linux_gnu: g++

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Copy README
        run: cp README.md haqumei-python/README.md

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../dist
          working-directory: haqumei-python

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [build-wheels, sdist]
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
