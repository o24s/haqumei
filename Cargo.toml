[workspace]
resolver = "3"
members = [
    "haqumei",
    "haqumei-bench",
    "haqumei-cli",
    "haqumei-dict-tool",
    "haqumei-eval",
    "haqumei-jlabel",
    "haqumei-kanalizer",
    "haqumei-macros",
    "haqumei-python",
]

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
bindgen = "0.72.1"
cc = "1.4.0"
clap = { version = "4.6.4", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
crossbeam-channel = "0.5.16"
csv = "1.4.0"
daachorse = "3.0.3"
digest-io = "0.1.0"
dirs = "6.0.0"
env_logger = "0.11.11"
fs4 = { version = "1.1.0", features = ["sync"] }
glob = "0.3.4"
haqumei-jlabel = { version = "0.1.1", path = "haqumei-jlabel" }
haqumei-kanalizer = { version = "0.1.3", path = "haqumei-kanalizer" }
haqumei-macros = { version = "0.1.3", path = "haqumei-macros" }
hex = "0.4.3"
libc = "0.2.189"
log = "0.4.33"
moka = { version = "0.12.15", features = ["sync"] }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "api-21",
    "copy-dylibs",
    "download-binaries",
    "ndarray",
    "std",
    "tls-rustls",
    "tracing",
] }
phf = { version = "0.14.0", features = ["macros"] }
proc-macro2 = "1.0.107"
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }
quote = "1.0.47"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking", "rustls"], default-features = false }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "3.0.3", features = ["full"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.19"
unicode-normalization = "0.1.25"
vibrato-rkyv = { version = "0.7.12" }
walkdir = "2.5.0"
zstd = "0.13.3"
