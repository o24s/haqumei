[workspace]
resolver = "3"
members = [
    "haqumei",
    "haqumei-bench",
    "haqumei-cli",
    "haqumei-dict-tool",
    "haqumei-eval",
    "haqumei-jlabel",
    "haqumei-jpreprocess",
    "haqumei-jpreprocess-core",
    "haqumei-jpreprocess-dictionary",
    "haqumei-jpreprocess-jpcommon",
    "haqumei-jpreprocess-njd",
    "haqumei-jpreprocess-window",
    "haqumei-kanalizer",
    "haqumei-macros",
    "haqumei-python",
]
# 辞書改善用の作業クレート。
exclude = ["haqumei-dict-lab"]

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
clap = { version = "4.6.6", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
csv = "1.4.0"
daachorse = "5.0.0"
digest-io = "0.1.0"
dirs = "7.0.0"
encoding_rs = "0.8.41"
env_logger = "0.11.11"
fs4 = { version = "1.1.0", features = ["sync"] }
glob = "0.3.4"
haqumei-jlabel = { version = "0.1.3", path = "haqumei-jlabel" }
haqumei-jpreprocess = { version = "0.1.0", path = "haqumei-jpreprocess", default-features = false }
haqumei-jpreprocess-core = { version = "0.1.0", path = "haqumei-jpreprocess-core" }
haqumei-jpreprocess-dictionary = { version = "0.1.0", path = "haqumei-jpreprocess-dictionary" }
haqumei-jpreprocess-jpcommon = { version = "0.1.0", path = "haqumei-jpreprocess-jpcommon" }
haqumei-jpreprocess-njd = { version = "0.1.0", path = "haqumei-jpreprocess-njd" }
haqumei-jpreprocess-window = { version = "0.1.0", path = "haqumei-jpreprocess-window" }
haqumei-kanalizer = { version = "0.1.6", path = "haqumei-kanalizer" }
haqumei-macros = { version = "0.1.5", path = "haqumei-macros" }
hex = "0.4.3"
log = "0.4.34"
moka = { version = "0.12.16", features = ["sync"] }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "api-27",
    "copy-dylibs",
    "download-binaries",
    "ndarray",
    "std",
    "tls-rustls",
    "tracing",
] }
phf = { version = "0.14.0", features = ["macros"] }
proc-macro2 = "1.0.107"
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
quote = "1.0.47"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "rustls"], default-features = false }
rkyv = { version = "0.8.18", features = ["bytecheck", "little_endian", "aligned", "pointer_width_32"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "3.0.5", features = ["full"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
vibrato = { package = "vibrato-rkyv", version = "0.7.17", default-features = false }
walkdir = "2.5.0"
zstd = "0.14.0"

[profile.dev.package.crawdad-rkyv]
opt-level = 3

[profile.dev.package.haqumei-jpreprocess-dictionary]
opt-level = 3

[profile.dev.package.vibrato-rkyv]
opt-level = 3
