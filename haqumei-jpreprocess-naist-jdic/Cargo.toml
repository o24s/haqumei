[package]
name = "haqumei-jpreprocess-naist-jdic"
edition = "2021"

version = "0.1.0"
description = "Japanese text preprocessor for Text-to-Speech application (OpenJTalk rewrite in rust language)."
license = "BSD-3-Clause"
repository = "https://github.com/o24s/haqumei"
keywords = ["tts", "openjtalk", "library"]
categories = ["text-processing"]
rust-version = "1.88.0"

documentation = "https://docs.rs/haqumei-jpreprocess-naist-jdic"

include = [
  "LICENSE",
  "NOTICE",
  "src/**",
  "build.json",
  "build.rs",
  "NOTICE.txt",
  "README.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
naist-jdic = [
  "dep:reqwest",
  "dep:md5",
  "dep:flate2",
  "dep:tar",
  "dep:serde",
  "dep:serde_json",
]

[dependencies]
lindera-dictionary.workspace = true

[build-dependencies]
lindera-dictionary.workspace = true
haqumei-jpreprocess-dictionary.workspace = true

reqwest = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[package.metadata.upstream]
repository = "https://github.com/jpreprocess/jpreprocess"
revision = "54cf9bc2d40a5d6f25144333e9cd03fd3258a126"
