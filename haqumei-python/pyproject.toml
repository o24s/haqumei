[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "haqumei"
version = "0.6.10"
description = "A Japanese Grapheme-to-Phoneme (G2P) library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: Apache Software License",
]
authors = [
  { name = "o24s" }
]


[dependency-groups]
dev = [
    "maturin>=1.10.2",
    "pytest>=9.0.2",
]


[tool.maturin]
include = ["haqumei.pyi"]
