[package]
name = "haqumei-macros"
version = "0.1.3"
edition = "2024"
authors = ["o24s <fulmlumo@gmail.com>"]
description = "Procedural macros for the Haqumei Japanese G2P library."
license = "Apache-2.0"
repository = "https://github.com/o24s/haqumei"
readme = "README.md"

[lib]
proc-macro = true

[features]
serde = ["dep:serde"]

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
