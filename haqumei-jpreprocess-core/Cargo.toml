[package]
name = "haqumei-jpreprocess-core"
edition = "2021"

version = "0.1.0"
description = "Japanese text preprocessor for Text-to-Speech application (OpenJTalk rewrite in rust language)."
license = "BSD-3-Clause"
repository = "https://github.com/o24s/haqumei"
keywords = ["tts", "openjtalk", "library"]
categories = ["text-processing"]
rust-version = "1.88.0"

documentation = "https://docs.rs/haqumei-jpreprocess-core"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
lindera = ["dep:lindera", "dep:lindera-dictionary"]
vibrato = ["dep:vibrato"]

[dependencies]
thiserror.workspace = true
bincode.workspace = true

once_cell.workspace = true

lindera = { workspace = true, optional = true }
lindera-dictionary = { workspace = true, optional = true }

vibrato = { workspace = true, optional = true }

serde = { workspace = true, features = ["derive"] }

regex.workspace = true
aho-corasick.workspace = true

[package.metadata.upstream]
repository = "https://github.com/jpreprocess/jpreprocess"
revision = "54cf9bc2d40a5d6f25144333e9cd03fd3258a126"
